name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java for Spark tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install check dependencies
        id: dependencies
        # Unit tests do not need the unavailable local eudalia package.
        run: python -m pip install 'ruff==0.16.4' 'pytest>=8' 'click>=8.1,<9' 'pyspark==3.5.0' uv

      - name: Lint
        run: ruff check .

      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ruff format --check .

      - name: Unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: python -m pytest -q tests
